# Flujo manual de auditoría integral y lints multi-lenguaje para Aura Music.
# Ejecuta análisis de Kotlin/Android, Rust, Python, integridad estructural, compilación
# continua con `--continue` (no se detiene en el primer error) y auditoría de dependencias
# viejas. Genera un archivo .zip en Artifacts con logs crudos, reportes XML/HTML de Android Lint
# y una página interactiva (`index.html`) consultable sin conexión desde el teléfono.

name: Lint y Auditoria Total

on:
  workflow_dispatch:
    inputs:
      compile_apk:
        description: "Compilar APK y ejecutar unit tests con --continue para capturar todos los errores"
        required: true
        default: true
        type: boolean
      run_rust_ndk_check:
        description: "Verificar compilación cruzada Rust (32 y 64 bits) con cargo-ndk"
        required: true
        default: true
        type: boolean
      check_outdated_deps:
        description: "Consultar Maven, Crates.io, Gradle y PyPI para detectar dependencias desactualizadas"
        required: true
        default: true
        type: boolean

jobs:
  lint-and-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar todo el código del proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Inicializar directorios de logs y códigos de salida
        run: |
          mkdir -p audit-logs audit-bundle
          echo '{}' > audit-logs/exit-codes.json

      - name: Configurar JDK 17 (sin caché)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python 3.11 y linters Python (ruff, mypy)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de análisis Python
        continue-on-error: true
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff mypy

      - name: Configurar Node.js para pruebas estructurales y entorno Web
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Clang / libclang-dev para bindgen de QuickJS-NG en Rust
        run: |
          sudo apt-get update && sudo apt-get install -y clang libclang-dev
          LIBCLANG_FILE="$(find /usr/lib -name 'libclang*.so*' 2>/dev/null | head -n 1)"
          if [ -n "$LIBCLANG_FILE" ]; then
            echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_FILE")" >> "$GITHUB_ENV"
          fi

      - name: Configurar Android SDK base
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar Android SDK 36, Build Tools y NDK 27
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
          NDK_PATH="$ANDROID_HOME/ndk/27.3.13750724"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Instalar Rust estable, clippy, rustfmt y targets Android (32 y 64 bits)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Descargar ktlint CLI para lint estático de Kotlin
        continue-on-error: true
        run: |
          curl -fsSL -o /tmp/ktlint "https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint"
          chmod +x /tmp/ktlint

      - name: Configurar Gradle 9.9.1 (sin caché)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"
          cache-disabled: true

      - name: 1. Auditar integridad estructural, Web y esquemas Room
        run: |
          set +e
          ROOT_DIR="$PWD"
          {
            if [ -f package-lock.json ]; then
              echo "=== npm ci ==="
              npm ci
            else
              echo "=== npm install (sin package-lock.json) ==="
              npm install --no-audit --no-fund
            fi
            RC_NPM=$?
            echo "=== tests/project-integrity.test.ts ==="
            npx --yes tsx --test tests/project-integrity.test.ts
            RC_INT=$?
            echo "=== npm run lint && npm run build ==="
            npm run lint && npm run build
            RC_WEB=$?
            RC=$((RC_NPM + RC_INT + RC_WEB))
          } > "$ROOT_DIR/audit-logs/integrity-and-web.log" 2>&1
          python3 -c "import json, os, sys; p=sys.argv[1]; os.makedirs(os.path.dirname(p), exist_ok=True); d=json.load(open(p)) if os.path.exists(p) else {}; d[sys.argv[2]]=int(sys.argv[3]); json.dump(d, open(p,'w'))" "$ROOT_DIR/audit-logs/exit-codes.json" "integrity-and-web" "${RC:-1}"

      - name: 2. Lint y compilación de Python (py_compile, ruff, mypy)
        run: |
          set +e
          ROOT_DIR="$PWD"
          PY_TARGETS="android/core/downloader/src/main/python/aura_ytdlp.py .github/scripts/check_outdated_deps.py .github/scripts/generate_audit_report.py"
          {
            echo "=== python3 -m py_compile ==="
            python3 -m py_compile $PY_TARGETS
            RC_PYC=$?
            echo ""
            echo "=== ruff check ==="
            ruff check $PY_TARGETS
            RC_RUFF=$?
            echo ""
            echo "=== ruff format --check ==="
            ruff format --check $PY_TARGETS
            RC_FMT=$?
            echo ""
            echo "=== mypy --ignore-missing-imports ==="
            mypy --ignore-missing-imports $PY_TARGETS
            RC_MYPY=$?
            RC=$((RC_PYC + RC_RUFF + RC_FMT + RC_MYPY))
          } > "$ROOT_DIR/audit-logs/python-lint.log" 2>&1
          python3 -c "import json, os, sys; p=sys.argv[1]; os.makedirs(os.path.dirname(p), exist_ok=True); d=json.load(open(p)) if os.path.exists(p) else {}; d[sys.argv[2]]=int(sys.argv[3]); json.dump(d, open(p,'w'))" "$ROOT_DIR/audit-logs/exit-codes.json" "python-lint" "${RC:-1}"

      - name: 3. Lint, tests y check multi-ABI de Rust (fmt, check, clippy, test, cargo-ndk)
        env:
          RUN_NDK: ${{ inputs.run_rust_ndk_check }}
        run: |
          set +e
          ROOT_DIR="$PWD"
          {
            cd "$ROOT_DIR/android/rust/aura_core"
            RC_CD=$?
            if [ "$RC_CD" -eq 0 ]; then
              echo "=== cargo fetch ==="
              cargo fetch
              RC_FETCH=$?
              echo ""
              echo "=== cargo fmt --check ==="
              cargo fmt --all -- --check
              RC_FMT=$?
              echo ""
              echo "=== cargo check --all-targets ==="
              cargo check --all-targets
              RC_CHK=$?
              echo ""
              echo "=== cargo clippy --all-targets ==="
              cargo clippy --all-targets -- -W clippy::all
              RC_CLIPPY=$?
              echo ""
              echo "=== cargo test ==="
              cargo test
              RC_TEST=$?
              RC_NDK=0
              if [ "$RUN_NDK" = "true" ]; then
                echo ""
                echo "=== cargo ndk check (32 y 64 bits) ==="
                cargo ndk -t armeabi-v7a -t arm64-v8a -t x86_64 --platform 26 check --lib --bin aura_qjs
                RC_NDK=$?
              fi
              RC=$((RC_FETCH + RC_FMT + RC_CHK + RC_CLIPPY + RC_TEST + RC_NDK))
            else
              echo "No se pudo acceder a android/rust/aura_core"
              RC=1
            fi
          } > "$ROOT_DIR/audit-logs/rust-lint-and-test.log" 2>&1
          cd "$ROOT_DIR"
          python3 -c "import json, os, sys; p=sys.argv[1]; os.makedirs(os.path.dirname(p), exist_ok=True); d=json.load(open(p)) if os.path.exists(p) else {}; d[sys.argv[2]]=int(sys.argv[3]); json.dump(d, open(p,'w'))" "$ROOT_DIR/audit-logs/exit-codes.json" "rust-lint-and-test" "${RC:-1}"

      - name: 4. Lint estático de Kotlin con ktlint
        run: |
          set +e
          ROOT_DIR="$PWD"
          {
            if [ -x /tmp/ktlint ]; then
              /tmp/ktlint "android/**/src/**/*.kt"
              RC=$?
            else
              echo "ktlint no estuvo disponible en este runner."
              RC=0
            fi
          } > "$ROOT_DIR/audit-logs/kotlin-ktlint.log" 2>&1
          python3 -c "import json, os, sys; p=sys.argv[1]; os.makedirs(os.path.dirname(p), exist_ok=True); d=json.load(open(p)) if os.path.exists(p) else {}; d[sys.argv[2]]=int(sys.argv[3]); json.dump(d, open(p,'w'))" "$ROOT_DIR/audit-logs/exit-codes.json" "kotlin-ktlint" "${RC:-1}"

      - name: 5. Ejecutar Android Lint en todos los módulos (--continue)
        run: |
          set +e
          ROOT_DIR="$PWD"
          chmod +x "$ROOT_DIR/android/gradlew"
          (
            cd "$ROOT_DIR/android"
            ./gradlew lintDebug --continue --no-daemon --no-build-cache --warning-mode all
          ) > "$ROOT_DIR/audit-logs/gradle-lint.log" 2>&1
          RC=$?
          python3 -c "import json, os, sys; p=sys.argv[1]; os.makedirs(os.path.dirname(p), exist_ok=True); d=json.load(open(p)) if os.path.exists(p) else {}; d[sys.argv[2]]=int(sys.argv[3]); json.dump(d, open(p,'w'))" "$ROOT_DIR/audit-logs/exit-codes.json" "gradle-lint" "${RC:-1}"

      - name: 6. Compilar APK Debug y ejecutar Unit Tests (--continue, sigue compilando tras errores)
        if: ${{ inputs.compile_apk }}
        run: |
          set +e
          ROOT_DIR="$PWD"
          chmod +x "$ROOT_DIR/android/gradlew"
          (
            cd "$ROOT_DIR/android"
            ./gradlew assembleDebug testDebugUnitTest -PauraAbis=armeabi-v7a,arm64-v8a,x86_64 --continue --no-daemon --no-build-cache --warning-mode all
          ) > "$ROOT_DIR/audit-logs/gradle-compile-and-test.log" 2>&1
          RC=$?
          python3 -c "import json, os, sys; p=sys.argv[1]; os.makedirs(os.path.dirname(p), exist_ok=True); d=json.load(open(p)) if os.path.exists(p) else {}; d[sys.argv[2]]=int(sys.argv[3]); json.dump(d, open(p,'w'))" "$ROOT_DIR/audit-logs/exit-codes.json" "gradle-compile-and-test" "${RC:-1}"

      - name: 7. Verificar consistencia de esquemas Room tras KSP
        run: |
          set +e
          ROOT_DIR="$PWD"
          {
            echo "=== Estado de android/core/database/schemas/ ==="
            find android/core/database/schemas -type f -print
            echo ""
            echo "=== Diff frente al esquema versionado ==="
            git diff --stat android/core/database/schemas/
            git diff android/core/database/schemas/
            RC=0
          } > "$ROOT_DIR/audit-logs/room-schema-diff.log" 2>&1
          python3 -c "import json, os, sys; p=sys.argv[1]; os.makedirs(os.path.dirname(p), exist_ok=True); d=json.load(open(p)) if os.path.exists(p) else {}; d[sys.argv[2]]=int(sys.argv[3]); json.dump(d, open(p,'w'))" "$ROOT_DIR/audit-logs/exit-codes.json" "room-schema-diff" "${RC:-0}"

      - name: 8. Auditar dependencias desactualizadas (Gradle, Rust, Python)
        if: ${{ inputs.check_outdated_deps }}
        run: |
          set +e
          ROOT_DIR="$PWD"
          python3 "$ROOT_DIR/.github/scripts/check_outdated_deps.py" \
            --root "$ROOT_DIR" \
            --output-json "$ROOT_DIR/audit-logs/outdated-deps.json" \
            --output-log "$ROOT_DIR/audit-logs/outdated-deps.log"
          RC=$?
          python3 -c "import json, os, sys; p=sys.argv[1]; os.makedirs(os.path.dirname(p), exist_ok=True); d=json.load(open(p)) if os.path.exists(p) else {}; d[sys.argv[2]]=int(sys.argv[3]); json.dump(d, open(p,'w'))" "$ROOT_DIR/audit-logs/exit-codes.json" "outdated-deps" "${RC:-1}"

      - name: 9. Construir página HTML interactiva y paquete .zip de auditoría
        if: always()
        run: |
          python3 .github/scripts/generate_audit_report.py \
            --logs-dir audit-logs \
            --deps-json audit-logs/outdated-deps.json \
            --android-dir android \
            --output-dir audit-bundle \
            --zip-path dist-audit/AuraMusic-Lint-Audit-Bundle.zip \
            --exit-codes-json audit-logs/exit-codes.json

      - name: 10. Subir artefacto .zip con reporte HTML interactivo y logs crudos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-Lint-Audit-Report
          path: dist-audit/AuraMusic-Lint-Audit-Bundle.zip
