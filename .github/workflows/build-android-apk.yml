# Flujo de compilación manual en la nube (GitHub Actions) para Aura Music.
# Se ejecuta EXCLUSIVAMENTE de forma manual (workflow_dispatch), sin caché alguna,
# permitiendo elegir entre APK universal o APKs individuales (32 bits y 64 bits).

name: apk Debug

on:
  workflow_dispatch:
    inputs:
      apk_mode:
        description: "Tipo de APK Debug a compilar"
        required: true
        default: "universal"
        type: choice
        options:
          - universal
          - individuales
          - solo-32bits
          - solo-64bits

jobs:
  build-apk-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar todo el código del proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configurar JDK 17 (sin caché)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python 3.11 para Chaquopy (sin caché)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Clang / libclang-dev para bindgen de QuickJS-NG en Rust
        run: |
          sudo apt-get update && sudo apt-get install -y clang libclang-dev
          LIBCLANG_FILE="$(find /usr/lib -name 'libclang*.so*' 2>/dev/null | head -n 1)"
          if [ -n "$LIBCLANG_FILE" ]; then
            echo "LIBCLANG_PATH=$(dirname "$LIBCLANG_FILE")" >> "$GITHUB_ENV"
          fi

      - name: Configurar Android SDK base
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar Android SDK 37, Build Tools y NDK 27
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.3.13750724"
          NDK_PATH="$ANDROID_HOME/ndk/27.3.13750724"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Instalar Rust estable y targets Android (32 y 64 bits)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Instalar cargo-ndk (sin caché)
        run: cargo install cargo-ndk --locked

      - name: Descargar dependencias de Rust y ejecutar tests nativos
        working-directory: android/rust/aura_core
        run: |
          cargo fetch
          cargo test

      - name: Configurar Gradle 9.9.1 (sin caché)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"
          cache-disabled: true

      - name: Dar permisos de ejecución a gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Compilar APK Debug (universal o individuales 32/64 bits) sin caché
        working-directory: android
        env:
          APK_MODE: ${{ inputs.apk_mode }}
        run: |
          mkdir -p ../dist-apks
          if [ "$APK_MODE" = "universal" ]; then
            ./gradlew assembleDebug -PauraAbis=armeabi-v7a,arm64-v8a,x86_64 --no-daemon --no-build-cache --rerun-tasks
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apks/AuraMusic-Debug-universal.apk
          elif [ "$APK_MODE" = "individuales" ]; then
            ./gradlew assembleDebug -PauraAbis=armeabi-v7a --no-daemon --no-build-cache --rerun-tasks
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apks/AuraMusic-Debug-32bit-armeabi-v7a.apk
            ./gradlew assembleDebug -PauraAbis=arm64-v8a --no-daemon --no-build-cache --rerun-tasks
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apks/AuraMusic-Debug-64bit-arm64-v8a.apk
          elif [ "$APK_MODE" = "solo-32bits" ]; then
            ./gradlew assembleDebug -PauraAbis=armeabi-v7a --no-daemon --no-build-cache --rerun-tasks
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apks/AuraMusic-Debug-32bit-armeabi-v7a.apk
          elif [ "$APK_MODE" = "solo-64bits" ]; then
            ./gradlew assembleDebug -PauraAbis=arm64-v8a --no-daemon --no-build-cache --rerun-tasks
            cp app/build/outputs/apk/debug/app-debug.apk ../dist-apks/AuraMusic-Debug-64bit-arm64-v8a.apk
          else
            echo "Modo desconocido: $APK_MODE"
            exit 1
          fi

      - name: Verificar librerías Rust/QuickJS y Chaquopy dentro del APK Debug
        run: |
          for apk in dist-apks/*.apk; do
            echo "=== Verificando $apk ==="
            if ! unzip -l "$apk" | grep -q "libaura_core.so"; then
              echo "::error::Falta libaura_core.so en $apk"
              exit 1
            fi
            if ! unzip -l "$apk" | grep -q "libaura_qjs.so"; then
              echo "::error::Falta libaura_qjs.so en $apk"
              exit 1
            fi
            if ! unzip -l "$apk" | grep -q "libpython3.11.so"; then
              echo "::error::Falta libpython3.11.so (Chaquopy Python 3.11) en $apk"
              exit 1
            fi
            if ! unzip -l "$apk" | grep -q "libchaquopy_java.so"; then
              echo "::error::Falta libchaquopy_java.so (Chaquopy JNI) en $apk"
              exit 1
            fi
            if ! unzip -l "$apk" | grep -q "assets/chaquopy/"; then
              echo "::error::Faltan los assets empaquetados de Chaquopy (assets/chaquopy/) en $apk"
              exit 1
            fi
          done

      - name: Subir artefacto APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-apk-Debug-${{ inputs.apk_mode }}
          path: dist-apks/*.apk
