<!-- Silueta monocroma 24x24 del logo Disco Local con Aura para notificaciones y tema monocromo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Aro del disco local (anillo nitido con hueco interno amplio) -->
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M 12,5.8 A 6.2,6.2 0 1,0 12,18.2 A 6.2,6.2 0 1,0 12,5.8 Z M 12,7.7 A 4.3,4.3 0 1,0 12,16.3 A 4.3,4.3 0 1,0 12,7.7 Z" />
  <!-- Icono Play centrado opticamente dentro del disco -->
  <path fill="#FFFFFF"
        d="M 10.65,10.05 C 10.65,9.68 11.06,9.46 11.38,9.68 L 14.22,11.63 C 14.49,11.81 14.49,12.19 14.22,12.37 L 11.38,14.32 C 11.06,14.54 10.65,14.32 10.65,13.95 Z" />
  <!-- Ondas de aura sonora envolviendo el disco -->
  <path fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round"
        d="M 15.18,3.26 A 9.3,9.3 0 0,1 21.02,14.25" />
  <path fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round"
        d="M 8.82,20.74 A 9.3,9.3 0 0,1 2.98,9.75" />
</svg>
