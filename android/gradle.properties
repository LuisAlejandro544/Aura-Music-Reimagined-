# Configuración de propiedades de Gradle para Aura Music.
# Habilita AndroidX moderno y compilación sin caché para garantizar builds limpios y reproducibles.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Incluye librerías nativas de 32 y 64 bits en el APK (apto para instalación directa y Uptodown).
android.bundle.enableUncompressedNativeLibs=false
