# Configuración de propiedades de Gradle para Aura Music.
# Habilita AndroidX moderno y compilación sin caché para garantizar builds limpios y reproducibles.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# El empaquetado de librerías nativas de 32 y 64 bits (armeabi-v7a, arm64-v8a, x86_64)
# se gestiona desde android/app/build.gradle.kts (abiFilters) conforme a AGP 9.5.1.
